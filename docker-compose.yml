services:
  obsidian-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obsidian-graph-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - INBOX_PATH=/app/data/inbox
      - PROCESSED_PATH=/app/data/processed
      - VAULT_PATH=/app/data/vault
    volumes:
      - ${HOST_INBOX_PATH:-./data/inbox}:/app/data/inbox
      - ${HOST_PROCESSED_PATH:-./data/processed}:/app/data/processed
      - ${HOST_VAULT_PATH:-./data/vault}:/app/data/vault